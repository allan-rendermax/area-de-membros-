<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão</title>
    <style>
      :root { --color-fundo: #0b0b0c; --color-texto: #f5f5f5; --color-texto-suave: #a1a1aa; --color-destaque: #e11d2e; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--color-fundo); color: var(--color-texto); font-family: system-ui, sans-serif; text-align: center; padding: 24px; }
      p { color: var(--color-texto-suave); }
      button { margin-top: 16px; background: var(--color-destaque); color: var(--color-texto); border: 0; border-radius: 6px; padding: 12px 20px; font-weight: 600; font-size: 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está sem internet</h1>
      <p>Conecte-se para acessar seus produtos.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
